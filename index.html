    <script>
      // habtastic-frame-deny-v1
      // Edge-level CSP frame-ancestors / X-Frame-Options are preferred, but
      // Lovable Cloud may not forward repository-defined response headers.
      // Therefore the page also fails CLOSED when embedded by an untrusted
      // cross-origin ancestor. Trusted Lovable preview/editor origins remain
      // allowed so development previews keep working.
      (function () {
        if (window.top === window.self) return;

        var allowed = /^https?:\/\/([a-z0-9-]+\.)*(lovable\.app|lovable\.dev|lovableproject\.com|habtastic\.com)$|^https?:\/\/localhost(:\d+)?$/;

        function denyFrame() {
          // Hide before an embedding page can place deceptive controls over us.
          document.documentElement.style.display = 'none';
          try { window.top.location = window.self.location.href; } catch (e) { /* sandboxed frame: remain hidden */ }
        }

        try {
          var origins = window.location.ancestorOrigins;
          if (origins && origins.length) {
            for (var i = 0; i < origins.length; i++) {
              if (!allowed.test(origins[i])) {
                denyFrame();
                return;
              }
            }
            return;
          }

          // Browsers without ancestorOrigins: allow only a provably same-origin
          // parent. Reading top.location.origin throws for cross-origin frames.
          if (window.top.location.origin === window.location.origin) return;
        } catch (e) {
          denyFrame();
          return;
        }

        // Unknown framed state is denied rather than silently failing open.
        denyFrame();
      })();
    </script>
